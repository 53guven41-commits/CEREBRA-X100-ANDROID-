name: CEREBRA X100 V03 PRO
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/cerebra/x100
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'CerebraX100'
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' }
          android {
            namespace 'com.cerebra.x100'
            compileSdk 35
            defaultConfig {
              applicationId 'com.cerebra.x100'
              minSdk 26
              targetSdk 34
              versionCode 3
              versionName '0.3'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
          <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-feature android:name="android.hardware.usb.host" android:required="false"/>
          <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>
          <application android:label="CEREBRA X100 PRO" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <service android:name=".GuardianJob" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="true"/>
          </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/cerebra/x100/MainActivity.java <<'EOF'
          package com.cerebra.x100;
          import android.app.*;
          import android.bluetooth.*;
          import android.bluetooth.le.*;
          import android.content.*;
          import android.graphics.*;
          import android.hardware.usb.*;
          import android.net.wifi.*;
          import android.os.*;
          import android.speech.tts.*;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
            static final String LOC="android.permission.ACCESS_FINE_LOCATION", COARSE="android.permission.ACCESS_COARSE_LOCATION", BT="android.permission.BLUETOOTH_CONNECT", SCAN="android.permission.BLUETOOTH_SCAN", NOTIFY="android.permission.POST_NOTIFICATIONS";
            final int CYAN=0xff00caff, GREEN=0xff70efb0, DARK=0xff091722;
            final Handler clock=new Handler(Looper.getMainLooper());
            TextView output,status; Radar radar; WifiManager wifi; BluetoothAdapter bt;
            BluetoothLeScanner ble; TextToSpeech voice; boolean voiceReady, live, active, classic; int page=0;
            String report="Henüz analiz yok."; SharedPreferences model; long lastSpoken=0;
            final Map<String,String> devices=new LinkedHashMap<>();
            boolean allowed(String p){return checkSelfPermission(p)==0;}
            boolean wifiOK(){if(!allowed(LOC)){requestPermissions(new String[]{LOC,COARSE},1);status.setText("Konum izni verip yeniden deneyin.");return false;} return true;}
            boolean btOK(boolean scan){if(Build.VERSION.SDK_INT>=31 && (!allowed(BT)||(scan&&!allowed(SCAN)))){requestPermissions(scan?new String[]{BT,SCAN}:new String[]{BT},2);status.setText("Yakındaki cihaz izni gerekli.");return false;}return !scan||Build.VERSION.SDK_INT>=31||wifiOK();}
            TextView text(String s,int size,int color){TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);t.setPadding(8,8,8,8);return t;}
            void button(LinearLayout parent,String label,Runnable fn){Button b=new Button(this);b.setText(label);b.setTextColor(0xffe7f6ff);b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(0xff204659));b.setOnClickListener(v->{try{fn.run();}catch(Exception e){show("İşlem tamamlanamadı: "+e.getClass().getSimpleName());}});parent.addView(b);}
            void show(String s){output.setText(s);report=s;}
            @Override public void onCreate(Bundle state){super.onCreate(state);wifi=(WifiManager)getApplicationContext().getSystemService(WIFI_SERVICE);BluetoothManager bm=(BluetoothManager)getSystemService(BLUETOOTH_SERVICE);bt=bm==null?null:bm.getAdapter();model=getSharedPreferences("pro_model",MODE_PRIVATE);
              ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setPadding(20,20,20,20);root.setBackgroundColor(DARK);scroll.addView(root);setContentView(scroll);
              root.addView(text("CEREBRA AI\nCYBER GUARDIAN X100",26,CYAN));root.addView(text("V0.3 PRO  |  LOCAL SMART ENGINE",15,GREEN));status=text("Sistem hazır • İnternetsiz",14,CYAN);root.addView(status);
              radar=new Radar(this);root.addView(radar,new LinearLayout.LayoutParams(-1,(int)(210*getResources().getDisplayMetrics().density)));output=text("Bir analiz seçin.",15,GREEN);
              button(root,"WI-FI RADAR / KANALLAR",()->wifiPage(true));button(root,"CANLI RADAR AÇ / KAPAT",()->toggleLive());
              button(root,"BLUETOOTH EŞLEŞMİŞ",()->paired());button(root,"BLUETOOTH KLASİK KEŞİF",()->discover(false));button(root,"BLE KEŞİF (12 SN)",()->discover(true));button(root,"USB / OTG",()->usb());
              button(root,"AKILLI ANALİZ",()->analysis(false));button(root,"NORMAL ORTAMI ÖĞRET",()->analysis(true));button(root,"ÖĞRENİLEN REFERANSI SİL",()->new AlertDialog.Builder(this).setMessage("Yerel öğrenme verileri silinsin mi?").setPositiveButton("Sil",(d,w)->{model.edit().clear().apply();show("Referans sıfırlandı.");}).setNegativeButton("İptal",null).show());
              button(root,"SESLİ RAPOR",()->speak(report));button(root,"RAPOR PAYLAŞ",()->share());button(root,"ARKA PLAN KONTROLÜ AÇ / KAPAT",()->background());root.addView(output);
              voice=new TextToSpeech(this,code->{if(code==TextToSpeech.SUCCESS&&voice!=null){Set<Voice> voices=voice.getVoices();if(voices!=null)for(Voice v:voices){if(v.getLocale().getLanguage().equals("tr")&&!v.isNetworkConnectionRequired()&&voice.setVoice(v)==TextToSpeech.SUCCESS){voiceReady=true;break;}}}});
            }
            @Override protected void onStart(){super.onStart();active=true;IntentFilter f=new IntentFilter();f.addAction(WifiManager.SCAN_RESULTS_AVAILABLE_ACTION);f.addAction(BluetoothDevice.ACTION_FOUND);f.addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED);if(Build.VERSION.SDK_INT>=33)registerReceiver(events,f,Context.RECEIVER_EXPORTED);else registerReceiver(events,f);}
            @Override protected void onStop(){active=false;live=false;clock.removeCallbacks(tick);stopSearch();unregisterReceiver(events);if(voice!=null)voice.stop();super.onStop();}
            @Override protected void onDestroy(){if(voice!=null)voice.shutdown();super.onDestroy();}
            final BroadcastReceiver events=new BroadcastReceiver(){public void onReceive(Context c,Intent i){try{String a=i.getAction();if(WifiManager.SCAN_RESULTS_AVAILABLE_ACTION.equals(a)&&active&&page==1){wifiPage(false);status.setText(i.getBooleanExtra(WifiManager.EXTRA_RESULTS_UPDATED,false)?"Radar güncellendi":"Android sonuçları (önbellek olabilir)");}if(BluetoothDevice.ACTION_FOUND.equals(a)&&classic&&page==2){BluetoothDevice d=i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);if(d!=null)found(d,i.getShortExtra(BluetoothDevice.EXTRA_RSSI,(short)-127));}if(BluetoothAdapter.ACTION_DISCOVERY_FINISHED.equals(a)&&classic){classic=false;status.setText("Klasik keşif tamamlandı.");}}catch(Exception e){status.setText("İzin veya donanım kontrolü gerekli.");}}};
            final Runnable tick=new Runnable(){public void run(){if(!active||!live)return;try{wifiPage(true);}catch(Exception e){status.setText("Radar geçici olarak durdu.");}if(active&&live)clock.postDelayed(this,35000);}};
            void leave(int next){if(next!=1){live=false;clock.removeCallbacks(tick);}if(next!=2)stopSearch();page=next;}
            List<android.net.wifi.ScanResult> samples(){if(wifi==null||!wifi.isWifiEnabled()){show("Wi-Fi kapalı veya desteklenmiyor.");return null;}if(!wifiOK())return null;List<android.net.wifi.ScanResult> a=new ArrayList<>(wifi.getScanResults());a.sort((x,y)->Integer.compare(y.level,x.level));return a;}
            void wifiPage(boolean request){leave(1);List<android.net.wifi.ScanResult> a=samples();if(a==null)return;radar.set(a);StringBuilder b=new StringBuilder("WI-FI • KANAL ANALİZİ\n");Map<String,Integer> channels=new TreeMap<>();for(android.net.wifi.ScanResult r:a){String ch=bandChannel(r.frequency);channels.put(ch,channels.getOrDefault(ch,0)+1);b.append('\n').append(r.SSID.isEmpty()?"Gizli ağ":r.SSID).append(" | ").append(r.level).append(" dBm | ").append(ch).append("\n").append(r.capabilities).append('\n');}b.append("\nKANAL YOĞUNLUĞU (görünen AP sayısı)\n");for(String k:channels.keySet())b.append(k).append(": ").append(channels.get(k)).append('\n');b.append("\nSinyal gücü yön veya mesafe değildir.\nSon örnek yaşı: ").append(age(a)).append(" sn");show(b.toString());if(request)status.setText(wifi.startScan()?"Yeni tarama istendi…":"Android taramayı sınırladı; son sonuç gösteriliyor.");}
            static String bandChannel(int f){if(f==2484)return "2.4 GHz / 14";if(f>=2412&&f<=2472)return "2.4 GHz / "+((f-2407)/5);if(f==5935)return "6 GHz / 2";if(f>=5955&&f<=7115)return "6 GHz / "+((f-5950)/5);if(f>=5000&&f<5900)return "5 GHz / "+((f-5000)/5);return f+" MHz";}
            long stamp(List<android.net.wifi.ScanResult> a){long t=0;for(android.net.wifi.ScanResult x:a)t=Math.max(t,x.timestamp);return t;}
            long age(List<android.net.wifi.ScanResult> a){return a.isEmpty()?0:Math.max(0,(SystemClock.elapsedRealtime()-stamp(a)/1000)/1000);}
            void toggleLive(){if(live){live=false;clock.removeCallbacks(tick);status.setText("Canlı radar kapalı.");return;}if(!wifiOK()||wifi==null||!wifi.isWifiEnabled())return;live=true;clock.removeCallbacks(tick);clock.post(tick);}
            void paired(){leave(3);if(!btOK(false))return;if(bt==null||!bt.isEnabled()){show("Bluetooth kapalı veya yok.");return;}StringBuilder b=new StringBuilder("EŞLEŞMİŞ BLUETOOTH\n");for(BluetoothDevice d:bt.getBondedDevices())b.append('\n').append(d.getName()).append(" | ").append(kind(d));show(b.toString());}
            String kind(BluetoothDevice d){BluetoothClass c=d.getBluetoothClass();if(c==null)return "Tür belirsiz";switch(c.getMajorDeviceClass()){case 256:return "Bilgisayar";case 512:return "Telefon";case 1024:return "Ses / görüntü";case 1280:return "Çevre birimi";case 1792:return "Giyilebilir";default:return "Diğer";}}
            void discover(boolean lowEnergy){leave(2);stopSearch();if(!btOK(true))return;if(bt==null||!bt.isEnabled()){show("Bluetooth kapalı veya desteklenmiyor.");return;}devices.clear();show("Keşif başladı; yalnızca yayın yapan cihazlar listelenir.");if(lowEnergy){ble=bt.getBluetoothLeScanner();if(ble==null){show("BLE tarayıcı bulunamadı.");return;}ble.startScan(callback);status.setText("BLE keşfi 12 saniye");}else{classic=bt.startDiscovery();if(!classic){status.setText("Klasik keşif başlatılamadı.");return;}status.setText("Klasik keşif 12 saniye");}clock.removeCallbacks(stop);clock.postDelayed(stop,12000);}
            final Runnable stop=()->{stopSearch();if(page==2)status.setText("Keşif tamamlandı.");};
            final ScanCallback callback=new ScanCallback(){@Override public void onScanResult(int type,android.bluetooth.le.ScanResult r){runOnUiThread(()->{if(active&&page==2&&ble!=null)try{found(r.getDevice(),r.getRssi());}catch(Exception ignored){}});}@Override public void onScanFailed(int code){runOnUiThread(()->{stopSearch();status.setText("BLE hata kodu: "+code);});}};
            void found(BluetoothDevice d,int rssi){String name=d.getName();devices.put(d.getAddress(),(name==null?"İsimsiz cihaz":name)+" | "+kind(d)+" | "+rssi+" dBm");StringBuilder b=new StringBuilder("KEŞFEDİLEN CİHAZ: "+devices.size()+"\n");for(String s:devices.values())b.append('\n').append(s);show(b.toString());}
            void stopSearch(){clock.removeCallbacks(stop);try{if(ble!=null){BluetoothLeScanner s=ble;ble=null;s.stopScan(callback);}if(classic&&bt!=null){classic=false;bt.cancelDiscovery();}}catch(Exception ignored){ble=null;classic=false;}}
            void usb(){leave(4);UsbManager u=(UsbManager)getSystemService(USB_SERVICE);if(u==null){show("USB hizmeti yok.");return;}StringBuilder b=new StringBuilder("USB / OTG: "+u.getDeviceList().size());for(UsbDevice d:u.getDeviceList().values()){b.append("\n\n").append(d.getProductName()).append(" | VID ").append(d.getVendorId()).append(" / PID ").append(d.getProductId());for(int i=0;i<d.getInterfaceCount();i++){int k=d.getInterface(i).getInterfaceClass();b.append("\nTür: ").append(k==3?"HID":k==8?"Depolama":k==2||k==10?"İletişim":"Sınıf "+k);}}show(b.toString());}
            boolean open(String c){return !c.contains("WPA")&&!c.contains("RSN")&&!c.contains("WEP")&&!c.contains("SAE")&&!c.contains("OWE")&&!c.contains("EAP")&&!c.contains("WAPI")&&!c.contains("DPP")&&!c.contains("OSEN")&&c.contains("ESS");}
            void analysis(boolean train){leave(5);List<android.net.wifi.ScanResult> a=samples();if(a==null)return;if(a.isEmpty()){show("Ölçüm yok; önce Wi-Fi radarını açın.");return;}int n=a.size(), weak=0, unprotected=0,wep=0;double sum=0;Set<String> seen=new HashSet<>();for(android.net.wifi.ScanResult r:a){sum+=r.level;if(r.level<=-80)weak++;String c=r.capabilities==null?"":r.capabilities.toUpperCase(Locale.ROOT);if(open(c))unprotected++;if(c.contains("WEP"))wep++;if(r.BSSID!=null)seen.add(r.BSSID);}double mean=sum/n;int count=model.getInt("n",0);double m=Float.intBitsToFloat(model.getInt("m",0)),v=Float.intBitsToFloat(model.getInt("v",0));
              if(train){if(stamp(a)<=0||age(a)>120||model.getLong("stamp",-1)==stamp(a)){show("Yeni ve güncel ölçüm gerekli. Radarı yenileyin.");return;}double[] u=Stats.add(count,m,v,mean);Set<String> known=new HashSet<>(model.getStringSet("known",Collections.emptySet()));known.addAll(seen);model.edit().putInt("n",count+1).putInt("m",Float.floatToIntBits((float)u[0])).putInt("v",Float.floatToIntBits((float)u[1])).putLong("stamp",stamp(a)).putStringSet("known",known).apply();show("Normal ortam örneği kaydedildi: "+(count+1)+" / ön değerlendirme için 5 ayrı güncel tarama gerekir.");return;}
              seen.removeAll(model.getStringSet("known",Collections.emptySet()));double z=Stats.score(count,m,v,mean);boolean anomaly=count>=5&&z>=3;String msg="AKILLI RAPOR\nAP: "+n+" | Zayıf: "+weak+"\nOrtalama sinyal: "+Math.round(mean)+" dBm\nAçık ağ göstergesi: "+unprotected+" | WEP: "+wep+"\nEğitim örneği: "+count+"\n"+(count==0?"Referans yok.":"Referansta olmayan AP: "+seen.size())+"\n"+(count<5?"İstatistiksel model henüz yetersiz.":"Sinyal sapması: "+String.format(Locale.US,"%.1f",z)+(anomaly?" • ALIŞILMADIK":" • olağan"))+"\n\nKendi ağınız için WPA2/WPA3 kullanın. Yeni AP veya sinyal sapması saldırı kanıtı değildir.\nSon örnek yaşı: "+age(a)+" sn";show(msg);if(anomaly&&age(a)<=120&&SystemClock.elapsedRealtime()-lastSpoken>60000){lastSpoken=SystemClock.elapsedRealtime();speak("Alışılmadık sinyal değişimi. Kendi ağınızı kontrol edin.");}}
            void speak(String s){if(!voiceReady||voice==null){status.setText("Çevrimdışı Türkçe ses paketi yok veya hazırlanıyor.");return;}voice.speak(s,TextToSpeech.QUEUE_FLUSH,null,"x100");}
            void share(){Intent i=new Intent(Intent.ACTION_SEND);i.setType("text/plain");i.putExtra(Intent.EXTRA_SUBJECT,"CEREBRA X100 V0.3 raporu");i.putExtra(Intent.EXTRA_TEXT,report);startActivity(Intent.createChooser(i,"Rapor paylaş"));}
            void background(){android.app.job.JobScheduler js=(android.app.job.JobScheduler)getSystemService(JOB_SCHEDULER_SERVICE);if(js.getPendingJob(GuardianJob.ID)!=null){js.cancel(GuardianJob.ID);status.setText("Arka plan kontrolü kapalı.");return;}if(Build.VERSION.SDK_INT>=33&&!allowed(NOTIFY)){requestPermissions(new String[]{NOTIFY},3);status.setText("Bildirim izninden sonra tekrar dokunun.");return;}GuardianJob.remember(this);android.app.job.JobInfo job=new android.app.job.JobInfo.Builder(GuardianJob.ID,new ComponentName(this,GuardianJob.class)).setPeriodic(15*60*1000L).build();status.setText(js.schedule(job)==android.app.job.JobScheduler.RESULT_SUCCESS?"Arka plan açık • Android zamanlamasıyla yaklaşık 15 dk+":"Zamanlama yapılamadı.");}
            class Radar extends View{final Paint p=new Paint(3);List<android.net.wifi.ScanResult> list=Collections.emptyList();Radar(Context c){super(c);}void set(List<android.net.wifi.ScanResult> a){list=new ArrayList<>(a);invalidate();}@Override protected void onDraw(Canvas c){super.onDraw(c);float x=getWidth()/2f,y=getHeight()/2f,r=Math.min(x,y)*.85f;p.setColor(0xff254e60);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(2);for(int i=1;i<=4;i++)c.drawCircle(x,y,r*i/4,p);c.drawLine(x-r,y,x+r,y,p);c.drawLine(x,y-r,x,y+r,p);p.setStyle(Paint.Style.FILL);int n=Math.min(list.size(),45);for(int i=0;i<n;i++){int signal=list.get(i).level;float d=r*Math.max(.08f,Math.min(1f,(-signal-30)/65f));double angle=i*2.399963;p.setColor(signal>=-70?GREEN:signal<=-80?0xfff46e70:0xffffc45e);c.drawCircle(x+(float)Math.cos(angle)*d,y+(float)Math.sin(angle)*d,7,p);}p.setColor(CYAN);p.setTextSize(21);p.setTextAlign(Paint.Align.CENTER);c.drawText("Sinyal radarı • yön göstermez",x,getHeight()-5,p);}}
          }
          EOF
          cat > app/src/main/java/com/cerebra/x100/GuardianJob.java <<'EOF'
          package com.cerebra.x100;
          import android.app.*;
          import android.app.job.*;
          import android.content.*;
          import android.hardware.usb.*;
          import android.net.wifi.*;
          import android.os.*;
          public class GuardianJob extends JobService {
           public static final int ID=3003;
           static String state(Context c){WifiManager w=(WifiManager)c.getApplicationContext().getSystemService(Context.WIFI_SERVICE);UsbManager u=(UsbManager)c.getSystemService(Context.USB_SERVICE);return "Wi-Fi: "+(w!=null&&w.isWifiEnabled()?"açık":"kapalı")+" | USB: "+(u==null?0:u.getDeviceList().size());}
           static void remember(Context c){c.getSharedPreferences("guardian_job",0).edit().putString("state",state(c)).apply();}
           @Override public boolean onStartJob(JobParameters params){try{android.content.SharedPreferences p=getSharedPreferences("guardian_job",0);String current=state(this),old=p.getString("state",current);if(!current.equals(old)){NotificationManager nm=getSystemService(NotificationManager.class);nm.createNotificationChannel(new NotificationChannel("guardian","CEREBRA kontrolü",NotificationManager.IMPORTANCE_DEFAULT));if(Build.VERSION.SDK_INT<33||checkSelfPermission("android.permission.POST_NOTIFICATIONS")==0){Intent i=new Intent(this,MainActivity.class);PendingIntent pi=PendingIntent.getActivity(this,0,i,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);nm.notify(ID,new Notification.Builder(this,"guardian").setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle("CEREBRA: Donanım durumu değişti").setContentText(current).setContentIntent(pi).setAutoCancel(true).build());}p.edit().putString("state",current).apply();}}catch(Exception ignored){}return false;}
           @Override public boolean onStopJob(JobParameters params){return true;}
          }
          EOF
          cat > app/src/main/java/com/cerebra/x100/Stats.java <<'EOF'
          package com.cerebra.x100;
          public final class Stats {
           public static double[] add(int n,double mean,double m2,double x){double d=x-mean;double next=mean+d/(n+1);return new double[]{next,m2+d*(x-next)};}
           public static double score(int n,double mean,double m2,double x){if(n<5)return 0;return Math.abs(x-mean)/Math.max(3,Math.sqrt(Math.max(0,m2)/(n-1)));}
          }
          EOF
          cat > StatsTest.java <<'EOF'
          package com.cerebra.x100;
          public class StatsTest {public static void main(String[] a){double m=0,v=0;int n=0;for(double x:new double[]{-70,-72,-68,-71,-69}){double[] q=Stats.add(n++,m,v,x);m=q[0];v=q[1];}if(Math.abs(m+70)>0.0001||Math.abs(v-10)>0.0001||Stats.score(n,m,v,-85)<3||Stats.score(n,m,v,-71)>=3||Stats.score(4,m,v,-90)!=0)throw new AssertionError();System.out.println("Stats: 5 checks passed");}}
          EOF
          mkdir -p /tmp/cerebra-stats
          javac -d /tmp/cerebra-stats app/src/main/java/com/cerebra/x100/Stats.java StatsTest.java
          java -cp /tmp/cerebra-stats com.cerebra.x100.StatsTest
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CEREBRA-X100-V03-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
