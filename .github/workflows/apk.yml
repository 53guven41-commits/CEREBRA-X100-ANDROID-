
name: CEREBRA X100 APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/cerebra/x100
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'CerebraX100'
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' }
          android {
            namespace 'com.cerebra.x100'
            compileSdk 35
            defaultConfig {
              applicationId 'com.cerebra.x100'
              minSdk 26
              targetSdk 34
              versionCode 2
              versionName '0.2'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
          <uses-feature android:name="android.hardware.usb.host" android:required="false"/>
          <application android:label="CEREBRA X100" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN"/>
          <category android:name="android.intent.category.LAUNCHER"/>
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/cerebra/x100/MainActivity.java <<'EOF'
          package com.cerebra.x100;
          import android.app.*;
          import android.os.*;
          import android.widget.*;
          import android.net.wifi.*;
          import android.bluetooth.*;
          import android.hardware.usb.*;
          import android.content.*;
          import java.util.*;

          public class MainActivity extends Activity {
            TextView result;
            public void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout l=new LinearLayout(this);
              l.setOrientation(1);
              l.setPadding(25,30,25,25);
              l.setBackgroundColor(0xff081522);
              TextView title=new TextView(this);
              title.setText("CEREBRA AI\nCYBER GUARDIAN X100\nV0.2 SMART ENGINE");
              title.setTextSize(24);
              title.setTextColor(0xff00ccff);
              l.addView(title);
              String[] names={"WI-FI ANALİZİ","BLUETOOTH","USB / OTG","AKILLI ANALİZ","REFERANS KAYDET"};
              for(int i=0;i<names.length;i++){
                final int n=i;
                Button k=new Button(this);
                k.setText(names[i]);
                l.addView(k);
                k.setOnClickListener(v->scan(n));
              }
              result=new TextView(this);
              result.setTextColor(0xff66ffbb);
              result.setTextSize(16);
              result.setText("SMART ENGINE HAZIR");
              ScrollView s=new ScrollView(this);
              s.addView(result);
              l.addView(s);
              setContentView(l);
            }

            boolean wifiPermission(){
              if(checkSelfPermission("android.permission.ACCESS_FINE_LOCATION")!=0){
                requestPermissions(new String[]{"android.permission.ACCESS_FINE_LOCATION","android.permission.ACCESS_COARSE_LOCATION"},1);
                result.setText("İzin verip yeniden deneyin.");
                return false;
              }
              return true;
            }

            void scan(int n){
              result.setText("");
              try{
                if(n==0 || n>=3){
                  WifiManager w=(WifiManager)getApplicationContext().getSystemService(WIFI_SERVICE);
                  if(w==null || !w.isWifiEnabled()){
                    result.setText("Wi-Fi kapalı.");
                    return;
                  }
                  if(!wifiPermission())return;
                  List<ScanResult> list=w.getScanResults();
                  if(n>=3){smart(list,n==4);return;}
                  result.setText("WI-FI ANALİZİ\n");
                  for(ScanResult r:list)
                    result.append("\n"+r.SSID+" | "+r.level+" dBm | "+r.frequency+" MHz\n"+r.capabilities+"\n");
                }
                if(n==1){
                  if(Build.VERSION.SDK_INT>=31 && checkSelfPermission("android.permission.BLUETOOTH_CONNECT")!=0){
                    requestPermissions(new String[]{"android.permission.BLUETOOTH_CONNECT"},2);
                    result.setText("İzin verip yeniden deneyin.");
                    return;
                  }
                  BluetoothAdapter a=BluetoothAdapter.getDefaultAdapter();
                  if(a==null){result.setText("Bluetooth bulunamadı.");return;}
                  result.setText("Bluetooth: "+(a.isEnabled()?"Açık":"Kapalı"));
                  for(BluetoothDevice d:a.getBondedDevices())
                    result.append("\n"+d.getName());
                }
                if(n==2){
                  UsbManager u=(UsbManager)getSystemService(USB_SERVICE);
                  result.setText("USB cihaz sayısı: "+u.getDeviceList().size());
                  for(UsbDevice d:u.getDeviceList().values())
                    result.append("\nVID: "+d.getVendorId()+" PID: "+d.getProductId());
                }
              }catch(Exception e){
                result.setText("Kontrol hatası: "+e.getMessage());
              }
            }

            void smart(List<ScanResult> list,boolean save){
              if(list.isEmpty()){
                result.setText("Wi-Fi sonucu bulunamadı.");
                return;
              }
              SharedPreferences p=getSharedPreferences("reference",MODE_PRIVATE);
              Set<String> old=p.getStringSet("aps",Collections.emptySet());
              Set<String> now=new HashSet<>();
              int open=0,weak=0,strong=0,wep=0,fresh=0;
              for(ScanResult r:list){
                String c=r.capabilities==null?"":r.capabilities;
                if(c.equals("[ESS]"))open++;
                if(c.contains("WEP"))wep++;
                if(r.level>=-70)strong++;
                if(r.level<=-80)weak++;
                if(r.BSSID!=null && now.add(r.BSSID) && !old.contains(r.BSSID))fresh++;
              }
              if(save){
                p.edit().putStringSet("aps",now).apply();
                result.setText("Yerel referans kaydedildi: "+now.size()+" erişim noktası.");
                return;
              }
              result.setText("SMART ENGINE V0.2\n\n");
              result.append("Son taramadaki erişim noktası: "+list.size());
              result.append("\nGüçlü sinyal: "+strong);
              result.append("\nZayıf sinyal: "+weak);
              result.append("\nAçık ağ göstergesi: "+open);
              result.append("\nWEP güvenlik uyarısı: "+wep);
              if(p.contains("aps"))
                result.append("\nYeni erişim noktası: "+fresh);
              else
                result.append("\nÖnce referans kaydedin.");
              if(Build.VERSION.SDK_INT<31 || checkSelfPermission("android.permission.BLUETOOTH_CONNECT")==0){
                BluetoothAdapter a=BluetoothAdapter.getDefaultAdapter();
                if(a!=null)
                  result.append("\nEşleşmiş Bluetooth: "+a.getBondedDevices().size());
              }
              UsbManager u=(UsbManager)getSystemService(USB_SERVICE);
              if(u!=null)
                result.append("\nUSB cihaz: "+u.getDeviceList().size());
              result.append("\n\nGÜVENLİK ÖNERİLERİ");
              result.append("\nKendi ağınızda WPA2 veya WPA3 kullanın.");
              result.append("\nBilinmeyen USB cihazlarına dikkat edin.");
              result.append("\nYeni ağ tek başına tehdit değildir.");
              result.append("\n\nYerel kural tabanlı analiz.");
            }
          }
          EOF
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CEREBRA-X100-V02-APK
          path: app/build/outputs/apk/debug/app-debug.apk
